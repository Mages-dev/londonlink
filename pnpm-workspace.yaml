# Supply chain: a release must be at least a day old before it can be
# installed (pnpm's default, written out so the policy is visible). Never
# relax it to get a package in; relax the version range instead.
minimumReleaseAge: 1440

# eslint-config-next bundles plugins that have not declared ESLint 10 support
# yet. Lint and one probe per plugin were verified identical on ESLint 10
# (2026-09-26; hold notes in the tooling-guide skill). Remove each entry once
# `pnpm view <plugin> peerDependencies.eslint` lists 10.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-react>eslint: '10'
    eslint-plugin-jsx-a11y>eslint: '10'
    eslint-plugin-import>eslint: '10'

allowBuilds:
  sharp: true
  unrs-resolver: true
